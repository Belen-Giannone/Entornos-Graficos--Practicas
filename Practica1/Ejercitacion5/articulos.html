<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Periféricos</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
    }

    table {
      width: 70%;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    th {
      background-color: #3c807c;
      color: white;
      padding: 12px;
      text-align: center;
    }

    td {
      border: 1px solid #693699;
      padding: 10px;
      text-align: center;
    }

    tr:nth-child(even) {
      background-color: #693699;
    }

    h3 {
      text-align: center;
      color: #693699;
    }
  </style>
</head>

<body>
  <h3>Listado de Stock Disponible</h3>
  <table>
    <tr>
      <th>Componente</th>
      <th>Precio Final (USD)</th>
    </tr>
    <tr>
      <td>Auriculares</td>
      <td>$45</td>
    </tr>
    <tr>
      <td>Mouse Gamer 17000 DPI</td>
      <td>$70</td>
    </tr>
    <tr>
      <td>Teclado Mecánico</td>
      <td>$170</td>
    </tr>
    <tr>
      <td>Monitor 180Hz 22"</td>
      <td>$380</td>
    </tr>
  </table>
</body>

</html>
